<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacte - Ado Staff Oficial</title>
    <link rel="stylesheet" href="css/contacte_estil.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Oswald:wght@500&display=swap"
        rel="stylesheet">
</head>

<body>

    <main class="fons-reixa">

        <div class="contenidor-contacte">
            <header>
                <a class="imagennav" href="paginaMusicaPrincipal.html"><img src="imatges/adoHeader.png" alt="Logo"></a>
                
            </header>
            <article>
                <h1>Contacta amb l'Equip d'Ado</h1>
                <p>Si us plau, omple el formulari</p>
            </article>

            <form action="#" method="POST" class="formulari-neó">

                <div class="grup-camp">
                    <label for="nom">Nom Complet:</label>
                    <input type="text" id="nom" name="nom" required placeholder="El teu nom o nom d'empresa">
                </div>

                <div class="grup-camp">
                    <label for="email">Correu Electrònic:</label>
                    <input type="email" id="email" name="email" required placeholder="el.teu.correu@exemple.cat">
                </div>

                <div class="grup-camp">
                    <label for="missatge">Missatge:</label>
                    <textarea id="missatge" name="missatge" rows="6" required
                        placeholder="Escriu el teu missatge detallat aquí..."></textarea>
                </div>

                <button type="submit" class="boto-enviar">ENVIAR CONSULTA</button>
            </form>
        </div>

    </main>

    <footer>
        <section class="xarxes">
            <a class="fotofooter" href="paginaMusicaPrincipal.html"><img src="imatges/adoHeader.png" alt="Logo"></a>
            <a href="https://www.instagram.com/ado_staff_official/"><img src="imatges/instagram.webp" class="imgfooter"
                    alt="Instagram staff Ado"></a>
            <a href="https://www.instagram.com/ado1024sweetpotet/"><img src="imatges/instagram.webp" class="imgfooter"
                    alt="instagram ado personal"></a>
            <a href="https://x.com/ado1024imokenp?lang=es"><img src="imatges/twitter.webp" class="imgfooter"
                    alt="logo x"></a>
            <a href="https://open.spotify.com/intl-es/artist/6mEQK9m2krja6X1cfsAjfl?si=NUmSF6oGTPmZ3tIT54eR7w"><img
                    src="imatges/logospotify.webp" class="imgfooter"></a>
            <p>© 2025 Ado. Tots els drets reservats.</p>
        </section>
    </footer>

</body>

</html>
